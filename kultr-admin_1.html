<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KULTR Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c; --bg2: #141414; --surface: #1a1a1a; --surface2: #222;
    --border: #2a2a2a; --border2: #333;
    --text: #f0ede8; --text2: #a09a90; --text3: #605c55;
    --accent: #e8ff00; --accent-dim: rgba(232,255,0,0.1); --accent2: #c8dd00;
    --red: #ff3b3b; --green: #4ade80; --blue: #60a5fa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Barlow',sans-serif; background:var(--bg); color:var(--text); }

  /* Nav */
  .admin-nav {
    position:sticky; top:0; z-index:100;
    background:rgba(12,12,12,0.95); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:60px;
  }
  .admin-nav .brand { font-family:'Bebas Neue'; font-size:1.6rem; letter-spacing:0.12em; }
  .admin-nav .brand span { color:var(--accent); }
  .admin-nav .badge { font-family:'Barlow Condensed'; font-size:0.72rem; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; padding:4px 10px;
    background:var(--accent); color:#000; margin-left:10px; }
  .admin-nav .stats { display:flex; gap:24px; font-size:0.85rem; color:var(--text2); }
  .admin-nav .stats strong { color:var(--accent); }

  /* Layout */
  .container { max-width:1100px; margin:0 auto; padding:24px; }

  /* Toolbar */
  .toolbar {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:24px; flex-wrap:wrap; gap:12px;
  }
  .toolbar h2 { font-family:'Bebas Neue'; font-size:2rem; letter-spacing:0.06em; }

  /* Buttons */
  .btn {
    padding:10px 24px; font-family:'Barlow Condensed'; font-weight:700;
    font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;
    border:none; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-accent { background:var(--accent); color:#000; }
  .btn-accent:hover { background:var(--accent2); }
  .btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
  .btn-ghost:hover { border-color:var(--text2); color:var(--text); }
  .btn-danger { background:transparent; color:var(--red); border:1px solid rgba(255,59,59,0.3); }
  .btn-danger:hover { background:rgba(255,59,59,0.1); }
  .btn-sm { padding:6px 14px; font-size:0.75rem; }

  /* Product Table */
  .product-table { width:100%; border-collapse:collapse; }
  .product-table th {
    text-align:left; padding:12px 16px;
    font-family:'Barlow Condensed'; font-weight:600; font-size:0.78rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text3);
    border-bottom:1px solid var(--border);
  }
  .product-table td {
    padding:14px 16px; border-bottom:1px solid var(--border);
    font-size:0.9rem; vertical-align:middle;
  }
  .product-table tr:hover td { background:var(--surface); }
  .product-img-cell {
    width:56px; height:56px; background:var(--surface2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .product-img-cell img { width:100%; height:100%; object-fit:cover; }
  .product-img-cell .placeholder { font-family:'Bebas Neue'; font-size:0.7rem; color:var(--text3); }
  .product-name-cell { font-weight:600; }
  .product-cat-cell { font-size:0.8rem; color:var(--text2); }
  .product-price-cell { font-family:'Bebas Neue'; font-size:1.2rem; }
  .badge-cell { font-family:'Barlow Condensed'; font-size:0.7rem; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px; display:inline-block; }
  .badge-new { background:var(--accent); color:#000; }
  .badge-hot { background:#ff8c00; color:#000; }
  .badge-sold { background:var(--red); color:#fff; }
  .colors-cell { display:flex; gap:4px; }
  .colors-cell span { width:16px; height:16px; border-radius:50%; border:2px solid var(--border); }
  .sizes-cell { font-family:'JetBrains Mono'; font-size:0.75rem; color:var(--text2); }
  .actions-cell { display:flex; gap:8px; }

  /* Modal */
  .modal-overlay {
    display:none; position:fixed; inset:0; z-index:500;
    background:rgba(0,0,0,0.8); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--bg2); border:1px solid var(--border);
    width:100%; max-width:640px; max-height:90vh; overflow-y:auto; padding:32px;
  }
  .modal h3 { font-family:'Bebas Neue'; font-size:1.6rem; letter-spacing:0.06em; margin-bottom:24px; }
  .form-group { margin-bottom:20px; }
  .form-label {
    display:block; margin-bottom:6px;
    font-family:'Barlow Condensed'; font-weight:600; font-size:0.78rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text2);
  }
  .form-input, .form-select, .form-textarea {
    width:100%; padding:12px 16px; background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-family:'Barlow'; font-size:0.9rem; outline:none;
    transition:border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
  .form-textarea { resize:vertical; min-height:80px; }
  .form-select { appearance:none; cursor:pointer; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-hint { font-size:0.75rem; color:var(--text3); margin-top:4px; }
  .form-colors-preview { display:flex; gap:6px; margin-top:8px; }
  .form-colors-preview span { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); }
  .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:28px; }

  /* Loading */
  .loading { text-align:center; padding:60px; color:var(--text3); }
  .loading::after { content:'...'; animation:dots 1.2s steps(3) infinite; }
  @keyframes dots { to { content:''; } }

  /* Empty state */
  .empty-state {
    text-align:center; padding:80px 24px; color:var(--text3);
  }
  .empty-state p { margin-bottom:16px; font-size:1.1rem; }

  /* Toast */
  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--accent); color:#000; padding:12px 24px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:0.85rem;
    letter-spacing:0.06em; text-transform:uppercase; z-index:700;
    opacity:0; transition:all 0.4s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Seed button */
  .seed-section { text-align:center; margin-top:16px; }

  @media(max-width:768px) {
    .product-table th:nth-child(n+5), .product-table td:nth-child(n+5) { display:none; }
    .form-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<nav class="admin-nav">
  <div>
    <span class="brand">KULT<span>R</span></span>
    <span class="badge">Admin</span>
  </div>
  <div class="stats">
    <span><strong id="totalProducts">0</strong> products</span>
    <span><strong id="liveProducts">0</strong> live</span>
  </div>
</nav>

<div class="container">
  <div class="toolbar">
    <h2>Products</h2>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" onclick="openStorePreview()">👁 View Store</button>
      <button class="btn btn-accent" onclick="openModal()">+ Add Product</button>
    </div>
  </div>

  <div id="productList">
    <div class="loading">Loading products</div>
  </div>

  <div class="seed-section" id="seedSection" style="display:none;">
    <button class="btn btn-ghost" onclick="seedProducts()">🌱 Seed Sample Products</button>
    <p style="font-size:0.78rem;color:var(--text3);margin-top:8px;">Add 8 sample products to get started quickly</p>
  </div>
</div>

<!-- PRODUCT FORM MODAL -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <h3 id="modalTitle">Add Product</h3>
    <input type="hidden" id="editId">

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Product Name</label>
        <input class="form-input" id="fName" placeholder="KULTR OG Tee">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="fCat">
          <option value="tee">Tee</option>
          <option value="oversized">Oversized</option>
          <option value="limited">Limited</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Price (₹)</label>
        <input class="form-input" id="fPrice" type="number" placeholder="1299">
      </div>
      <div class="form-group">
        <label class="form-label">Badge</label>
        <select class="form-select" id="fBadge">
          <option value="">None</option>
          <option value="new">New</option>
          <option value="hot">🔥 Hot</option>
          <option value="sold">Sold Out</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tag / Subtitle</label>
      <input class="form-input" id="fTag" placeholder="Classic, Street, Limited, Essential, Graphic">
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="fDesc" placeholder="The one that started it all. 240 GSM premium cotton..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Product Image</label>
      <div id="dropZone" style="border:2px dashed var(--border);padding:24px;text-align:center;cursor:pointer;transition:border-color 0.2s;position:relative;"
           onclick="document.getElementById('fileInput').click()"
           ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
           ondragleave="this.style.borderColor='var(--border)'"
           ondrop="event.preventDefault();this.style.borderColor='var(--border)';handleFileDrop(event.dataTransfer.files[0])">
        <div id="dropContent">
          <div style="font-size:2rem;margin-bottom:8px;">📸</div>
          <div style="font-family:'Barlow Condensed';font-weight:600;font-size:0.85rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text2);">Drag & drop image here or click to browse</div>
          <div style="font-size:0.75rem;color:var(--text3);margin-top:6px;">JPG, PNG · Max 500KB recommended</div>
        </div>
        <div id="imagePreviewWrap" style="display:none;">
          <img id="imagePreview" style="max-height:180px;max-width:100%;object-fit:contain;">
          <div style="margin-top:8px;">
            <button type="button" class="btn btn-danger btn-sm" onclick="event.stopPropagation();clearImage()">Remove</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileDrop(this.files[0])">
      </div>
      <input type="hidden" id="fImage">
      <div class="form-hint">Image is stored directly — no external hosting needed</div>
    </div>

    <div class="form-group">
      <label class="form-label">Colors (hex, comma separated)</label>
      <input class="form-input" id="fColors" placeholder="#0c0c0c, #f0ede8, #4a5a3a" oninput="previewColors()">
      <div class="form-colors-preview" id="colorPreview"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Sizes (comma separated)</label>
      <input class="form-input" id="fSizes" placeholder="S, M, L, XL, XXL">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Sort Order</label>
        <input class="form-input" id="fOrder" type="number" placeholder="1" value="1">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;">
        <!-- spacer -->
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveProduct()" id="saveBtn">Save Product</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px;text-align:center;">
    <h3>Delete Product?</h3>
    <p style="color:var(--text2);margin-bottom:24px;">This action cannot be undone.</p>
    <input type="hidden" id="deleteId">
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-ghost" onclick="document.getElementById('deleteModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjvbQGKqrxqrYY2c68pwXwZY-Q1ANqqDU",
    authDomain: "kultr-b5d0b.firebaseapp.com",
    projectId: "kultr-b5d0b",
    storageBucket: "kultr-b5d0b.firebasestorage.app",
    messagingSenderId: "174942057135",
    appId: "1:174942057135:web:a32652084fdf8f198a1a5a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const productsRef = collection(db, "products");

  let products = [];

  // Make functions global
  window.openModal = function(id) {
    const modal = document.getElementById('productModal');
    if (id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editId').value = id;
      document.getElementById('fName').value = p.name || '';
      document.getElementById('fCat').value = p.cat || 'tee';
      document.getElementById('fPrice').value = p.price || '';
      document.getElementById('fBadge').value = p.badge || '';
      document.getElementById('fTag').value = p.tag || '';
      document.getElementById('fDesc').value = p.desc || '';
      document.getElementById('fImage').value = p.image || '';
      document.getElementById('fColors').value = (p.colors || []).join(', ');
      document.getElementById('fSizes').value = (p.sizes || []).join(', ');
      document.getElementById('fOrder').value = p.order || 1;
    } else {
      document.getElementById('modalTitle').textContent = 'Add Product';
      document.getElementById('editId').value = '';
      document.querySelectorAll('.form-input, .form-textarea').forEach(el => el.value = '');
      document.getElementById('fCat').value = 'tee';
      document.getElementById('fBadge').value = '';
      document.getElementById('fOrder').value = products.length + 1;
    }
    previewColors();
    // Handle image preview for edit mode
    const existingImage = document.getElementById('fImage').value;
    if (existingImage) {
      document.getElementById('imagePreview').src = existingImage;
      document.getElementById('imagePreviewWrap').style.display = 'block';
      document.getElementById('dropContent').style.display = 'none';
    } else {
      document.getElementById('imagePreviewWrap').style.display = 'none';
      document.getElementById('dropContent').style.display = 'block';
    }
    modal.classList.add('open');
  };

  window.handleFileDrop = function(file) {
    if (!file || !file.type.startsWith('image/')) { showToast('Please select an image file'); return; }
    if (file.size > 1048576) { showToast('Image too large — keep under 1MB'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      // Resize image to reduce Base64 size
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxW = 800, maxH = 1000;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('fImage').value = base64;
        document.getElementById('imagePreview').src = base64;
        document.getElementById('imagePreviewWrap').style.display = 'block';
        document.getElementById('dropContent').style.display = 'none';
        showToast('Image loaded!');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.clearImage = function() {
    document.getElementById('fImage').value = '';
    document.getElementById('imagePreviewWrap').style.display = 'none';
    document.getElementById('dropContent').style.display = 'block';
    document.getElementById('fileInput').value = '';
  };

  window.closeModal = function() {
    document.getElementById('productModal').classList.remove('open');
  };

  window.saveProduct = async function() {
    const name = document.getElementById('fName').value.trim();
    const cat = document.getElementById('fCat').value;
    const price = parseInt(document.getElementById('fPrice').value) || 0;
    const badge = document.getElementById('fBadge').value;
    const tag = document.getElementById('fTag').value.trim();
    const desc = document.getElementById('fDesc').value.trim();
    const image = document.getElementById('fImage').value.trim();
    const colors = document.getElementById('fColors').value.split(',').map(c => c.trim()).filter(c => c);
    const sizes = document.getElementById('fSizes').value.split(',').map(s => s.trim()).filter(s => s);
    const order = parseInt(document.getElementById('fOrder').value) || 1;

    if (!name || !price) { showToast('Name and Price are required'); return; }

    const data = { name, cat, price, badge, tag, desc, image, colors, sizes, order };
    const editId = document.getElementById('editId').value;

    try {
      if (editId) {
        await updateDoc(doc(db, "products", editId), data);
        showToast('Product updated!');
      } else {
        await addDoc(productsRef, data);
        showToast('Product added!');
      }
      closeModal();
      loadProducts();
    } catch (e) {
      showToast('Error: ' + e.message);
    }
  };

  window.openDelete = function(id) {
    document.getElementById('deleteId').value = id;
    document.getElementById('deleteModal').classList.add('open');
  };

  window.confirmDelete = async function() {
    const id = document.getElementById('deleteId').value;
    try {
      await deleteDoc(doc(db, "products", id));
      document.getElementById('deleteModal').classList.remove('open');
      showToast('Product deleted');
      loadProducts();
    } catch (e) {
      showToast('Error: ' + e.message);
    }
  };

  window.previewColors = function() {
    const val = document.getElementById('fColors').value;
    const colors = val.split(',').map(c => c.trim()).filter(c => c);
    document.getElementById('colorPreview').innerHTML = colors.map(c =>
      `<span style="background:${c}"></span>`
    ).join('');
  };

  window.openStorePreview = function() {
    window.open('https://saikausik5-lab.github.io/kultr/', '_blank');
  };

  window.seedProducts = async function() {
    const samples = [
      { name:"KULTR OG Tee", cat:"tee", tag:"Classic", price:1299, badge:"new", desc:"The one that started it all. 240 GSM premium cotton, oversized fit, embossed KULTR chest logo.", image:"", colors:["#0c0c0c","#f0ede8","#4a5a3a"], sizes:["S","M","L","XL","XXL"], order:1 },
      { name:"Concrete Jungle Oversized", cat:"oversized", tag:"Street", price:1599, badge:"hot", desc:"Heavy 280 GSM drop-shoulder cut with distressed concrete wash. Raw edges. City-proof.", image:"", colors:["#3a3a3a","#8b7d6b","#2a2a3a"], sizes:["M","L","XL","XXL"], order:2 },
      { name:"KULTR × Neon Nights", cat:"limited", tag:"Limited", price:1899, badge:"sold", desc:"Limited to 100 pieces. Reflective neon print on midnight black. Each piece numbered.", image:"", colors:["#0c0c0c"], sizes:["S","M","L","XL"], order:3 },
      { name:"Basecamp Tee", cat:"tee", tag:"Essential", price:999, badge:"", desc:"Clean, minimal, essential. Soft 200 GSM cotton with tonal KULTR back print.", image:"", colors:["#f0ede8","#0c0c0c","#1a3a5a","#5a2a2a"], sizes:["S","M","L","XL","XXL"], order:4 },
      { name:"Drift Oversized", cat:"oversized", tag:"Street", price:1499, badge:"new", desc:"Washed olive 280 GSM with split-hem detail. Dropped shoulders, relaxed silhouette.", image:"", colors:["#4a5a3a","#0c0c0c","#8b7d6b"], sizes:["M","L","XL","XXL"], order:5 },
      { name:"KULTR Type Tee", cat:"tee", tag:"Graphic", price:1199, badge:"", desc:"Full front typographic KULTR print in deconstructed Helvetica.", image:"", colors:["#0c0c0c","#f0ede8"], sizes:["S","M","L","XL"], order:6 },
      { name:"Static Drop", cat:"limited", tag:"Limited", price:2199, badge:"hot", desc:"TV static all-over print with hidden KULTR watermark. 50-piece micro drop.", image:"", colors:["#3a3a3a"], sizes:["S","M","L","XL"], order:7 },
      { name:"Daily Driver Tee", cat:"tee", tag:"Essential", price:899, badge:"", desc:"Your everyday blank — but better. 220 GSM ringspun cotton, pre-shrunk.", image:"", colors:["#0c0c0c","#f0ede8","#1a3a5a","#5a2a2a","#4a5a3a"], sizes:["S","M","L","XL","XXL"], order:8 },
    ];
    for (const p of samples) { await addDoc(productsRef, p); }
    showToast('8 sample products added!');
    loadProducts();
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function loadProducts() {
    const listEl = document.getElementById('productList');
    try {
      const q = query(productsRef, orderBy("order", "asc"));
      const snap = await getDocs(q);
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      document.getElementById('totalProducts').textContent = products.length;
      document.getElementById('liveProducts').textContent = products.filter(p => p.badge !== 'sold').length;

      if (products.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><p>No products yet</p></div>';
        document.getElementById('seedSection').style.display = 'block';
        return;
      }
      document.getElementById('seedSection').style.display = 'none';

      listEl.innerHTML = `<table class="product-table">
        <thead><tr>
          <th>Image</th><th>Product</th><th>Price</th><th>Badge</th><th>Colors</th><th>Sizes</th><th>Actions</th>
        </tr></thead>
        <tbody>${products.map(p => `<tr>
          <td><div class="product-img-cell">${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<span class="placeholder">KULTR</span>`}</div></td>
          <td><div class="product-name-cell">${p.name}</div><div class="product-cat-cell">${p.tag || p.cat}</div></td>
          <td><span class="product-price-cell">₹${(p.price||0).toLocaleString()}</span></td>
          <td>${p.badge ? `<span class="badge-cell badge-${p.badge}">${p.badge==='sold'?'Sold Out':p.badge==='hot'?'🔥 Hot':'New'}</span>` : '—'}</td>
          <td><div class="colors-cell">${(p.colors||[]).map(c=>`<span style="background:${c}"></span>`).join('')}</div></td>
          <td><span class="sizes-cell">${(p.sizes||[]).join(', ')}</span></td>
          <td><div class="actions-cell">
            <button class="btn btn-ghost btn-sm" onclick="openModal('${p.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="openDelete('${p.id}')">Delete</button>
          </div></td>
        </tr>`).join('')}</tbody>
      </table>`;
    } catch (e) {
      listEl.innerHTML = `<div class="empty-state"><p style="color:var(--red)">Error: ${e.message}</p></div>`;
    }
  }

  loadProducts();
</script>
</body>
</html>
